name: Secret Rotation Validation Test

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  rotation-test:
    name: Validate Zero-Downtime Secret Rotation
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger Manual Rotation in AWS Secrets Manager
        run: |
          echo "Triggering manual rotation for database secret..."
          NEW_PASS="RotatedPassword_$(date +%s)_CI_Test!"
          aws secretsmanager put-secret-value \
            --secret-id myapp/dev/app/database \
            --secret-string "{\"username\":\"dev_db_user\",\"password\":\"${NEW_PASS}\",\"host\":\"db-dev.myapp.internal\",\"port\":\"5432\"}"
          echo "✓ Updated secret value in Secrets Manager."

      - name: Wait for App Cache Expiry Window
        run: |
          echo "Waiting 15 seconds for app cache refresh..."
          sleep 15

      - name: Verify App Health Endpoint Post-Rotation
        run: |
          APP_URL="${{ secrets.APP_DEMO_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "APP_DEMO_URL secret not set, skipping live HTTP endpoint verification."
            exit 0
          fi

          echo "Querying app /health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health")
          if [ "$STATUS" -eq 200 ]; then
            echo "✓ App endpoint returned 200 OK post-rotation."
          else
            echo "ERROR: App health endpoint returned HTTP $STATUS post-rotation!"
            exit 1
          fi
