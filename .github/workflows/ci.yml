name: CI Security & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Code Quality & Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum

      - name: Run Go Unit Tests with Race Detector
        run: |
          cd app
          go test -v -race ./...

      - name: Run Go Vet & Staticcheck
        run: |
          cd app
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog-actions-scan@v3.63.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Run Gosec AST Security Audit
        uses: securego/gosec@master
        with:
          args: './app/...'

  build-push:
    name: Docker Build & ECR Push via OIDC
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Tag Container Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myapp-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Trivy CVE Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/myapp-repo:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Container Image to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: myapp-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  secret-validation:
    name: Validate Secrets Manager Structure (CI Role - No GetSecretValue)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via CI Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify Secret Metadata Existence (DescribeSecret)
        run: |
          echo "Validating required secret path metadata exists without fetching values..."
          aws secretsmanager describe-secret --secret-id myapp/dev/app/database
          aws secretsmanager describe-secret --secret-id myapp/dev/app/api-keys
          aws secretsmanager describe-secret --secret-id myapp/dev/app/config
          echo "✓ CI role successfully validated secret metadata structure."

      - name: Verify CI Explicit Deny on GetSecretValue
        run: |
          echo "Verifying CI Role is EXPLICITLY DENIED from reading secret values..."
          if aws secretsmanager get-secret-value --secret-id myapp/dev/app/database 2>&1 | grep -q "AccessDeniedException"; then
            echo "✓ Zero-trust verification passed: CI role is blocked from reading secret values."
          else
            echo "ERROR: CI role was able to read secret value! Zero-trust policy violation."
            exit 1
          fi
