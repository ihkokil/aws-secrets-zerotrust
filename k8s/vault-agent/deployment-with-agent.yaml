apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo-vault-agent
  namespace: secrets-demo
  labels:
    app: secrets-demo-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo-agent
  template:
    metadata:
      labels:
        app: secrets-demo-agent
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app-dev"
    spec:
      serviceAccountName: secrets-demo-sa
      automountServiceAccountToken: true

      volumes:
        - name: vault-secrets
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: vault-agent-config

      initContainers:
        - name: vault-agent-init
          image: hashicorp/vault:1.15.2
          command: ["vault", "agent", "-config=/etc/vault/vault-agent-config.hcl", "-exit-after-auth=true"]
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: config
              mountPath: /etc/vault
          env:
            - name: VAULT_ADDR
              value: "http://vault.secrets-demo.svc.cluster.local:8200"

      containers:
        - name: app
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/myapp-repo:v1.0.0
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: APP_ENV
              value: "dev"
            - name: SECRET_PROVIDER
              value: "file-sidecar"
            - name: SECRET_FILE_PATH
              value: "/vault/secrets/database.json"

          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
