apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo-app
  namespace: secrets-demo
  labels:
    app: secrets-demo
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      serviceAccountName: secrets-demo-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/myapp-repo:v1.0.0
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: APP_ENV
              value: "dev"
            - name: SECRET_PROVIDER
              value: "aws-secrets-manager"
            - name: AWS_REGION
              value: "us-east-1"
            - name: SECRET_PATH_PREFIX
              value: "myapp/dev/app"
            - name: VAULT_ADDR
              value: "http://vault.secrets-demo.svc.cluster.local:8200"
            - name: PORT
              value: "8080"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
